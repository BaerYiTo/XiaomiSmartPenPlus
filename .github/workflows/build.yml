name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # The Ubuntu runner already provides Android command-line tools.
      - name: Backend regression
        run: python3 backend-tests/run_tests.py
      - name: Install Android SDK
        run: |
          sdk_tool="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdk_tool" --licenses > /dev/null
          if ! "$sdk_tool" 'platforms;android-37.0' 'build-tools;37.0.0' > sdk-install.log 2>&1; then
            cat sdk-install.log
            python3 -c 'from pathlib import Path; s=Path("sdk-install.log").read_text()[-4000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare verified Gradle distribution
        run: |
          gradle_zip="$RUNNER_TEMP/gradle-9.6.0-bin.zip"
          curl --fail --location --retry 3 --max-time 180 \
            --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/gradle/gradle-distributions/releases/assets/451669088' \
            --output "$gradle_zip"
          echo "bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01  $gradle_zip" | sha256sum --check
          GRADLE_VERIFIED_ZIP="$gradle_zip" python3 -c 'import os; from pathlib import Path; p=Path("gradle/wrapper/gradle-wrapper.properties"); s=p.read_text(); s="\n".join("distributionUrl="+Path(os.environ["GRADLE_VERIFIED_ZIP"]).as_uri() if line.startswith("distributionUrl=") else line for line in s.splitlines())+"\n"; p.write_text(s)'
      - name: Build and lint
        env:
          SMARTPEN_CI_MAVEN: ${{ runner.temp }}/verified-maven
        run: |
          compiler_dir="$SMARTPEN_CI_MAVEN/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.4.20"
          mkdir -p "$compiler_dir"
          compiler_jar="$compiler_dir/kotlin-compiler-embeddable-2.4.20.jar"
          compiler_pom="$compiler_dir/kotlin-compiler-embeddable-2.4.20.pom"
          curl --fail --location --retry 3 --max-time 180 \
            --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/JetBrains/kotlin/releases/assets/587891620' \
            --output "$compiler_jar"
          curl --fail --location --retry 3 --max-time 60 \
            'https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.4.20/kotlin-compiler-embeddable-2.4.20.pom' \
            --output "$compiler_pom"
          echo "cf97161430683fb9af96dc6a7017ffae1fe8737b80d12eee11f2fe3e76f8ded8  $compiler_jar" | sha256sum --check
          echo "269d98cc4c68670c11e4aeb404e1c7c6f31b782321908d7268ba25cd236d59b2  $compiler_pom" | sha256sum --check
          if ! bash gradlew :app:assembleDebug :app:lintDebug --console=plain > gradle-build.log 2>&1; then
            cat gradle-build.log
            python3 -c 'from pathlib import Path; s=Path("gradle-build.log").read_text()[-6000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
          cat gradle-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: XiaomiSmartPenPlus-debug
          path: app/build/outputs/apk/debug/app-debug.apk

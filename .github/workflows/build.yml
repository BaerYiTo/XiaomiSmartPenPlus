name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # The Ubuntu runner already provides Android command-line tools.
      - name: Backend regression
        run: python3 backend-tests/run_tests.py
      - name: Install Android SDK
        run: |
          sdk_tool="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdk_tool" --licenses > /dev/null
          if ! "$sdk_tool" --channel=3 'platforms;android-37' 'build-tools;37.0.0' > sdk-install.log 2>&1; then
            cat sdk-install.log
            python3 -c 'from pathlib import Path; s=Path("sdk-install.log").read_text()[-4000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint
        run: bash gradlew :app:assembleDebug :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: XiaomiSmartPenPlus-debug
          path: app/build/outputs/apk/debug/app-debug.apk

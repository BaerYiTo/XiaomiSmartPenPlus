name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend regression
        run: python3 backend-tests/run_tests.py
      - name: Build and lint
        run: bash gradlew :app:assembleDebug :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: XiaomiSmartPenPlus-debug
          path: app/build/outputs/apk/debug/app-debug.apk
